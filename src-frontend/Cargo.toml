[package]
name = "aurorabook-frontend"
version = "0.1.0"
edition = "2021"

[lib]
name = "aurorabook_frontend"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Leptos
leptos = { version = "0.6", features = ["csr"] }
leptos_router = "0.6"
leptos_meta = "0.6"

# Note: Tauri is accessed via __TAURI__ global object in JavaScript/WASM
# We don't need Tauri Rust crates in the frontend

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Web APIs
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlAudioElement",
  "MediaQueryList",
  "MediaQueryListEvent",
  "Event",
  "EventTarget",
  "Storage",
  "Location",
  "HtmlInputElement",
  "HtmlButtonElement",
  "HtmlDivElement",
  "HtmlSpanElement",
  "HtmlAnchorElement",
  "HtmlImageElement",
  "MediaSession",
  "MediaMetadata",
  "MediaImage",
  "Navigator",
  "MediaDevices",
] }
gloo-utils = "0.1"
gloo-timers = "0.2"
gloo-storage = "0.2"

# Utilities
console_error_panic_hook = "0.1"
tracing = "0.1"
tracing-wasm = "0.1"
js-sys = "0.3"
