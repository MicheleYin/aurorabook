[build]
target-dir = "../../.cargo-target"

# ort links `@rpath/libwebgpu_dawn.dylib`; Tauri 2 places `bundle.resources` under
# `Contents/Resources/resources/`, so the dylib resolves at
# `Resources/resources/ort-dylibs/` (see tauri.macos.conf.json + build.rs copy).
[target.aarch64-apple-darwin]
rustflags = [
  "-C", "link-arg=-mmacosx-version-min=12.0",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../Resources/resources/ort-dylibs",
]

[target.x86_64-apple-darwin]
rustflags = [
  "-C", "link-arg=-mmacosx-version-min=12.0",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../Resources/resources/ort-dylibs",
]

[alias]
# Generate `resources/voice-samples/{lang}/{F1..M5}.mp3` previews used by settings playback.
gen-voice-samples = "run --release --features gen-voice-samples --bin gen_voice_samples"

# Do not set ORT_DIRECT_LINK / ORT_LIB_LOCATION globally here — they break macOS
# desktop (ort-sys skips pyke download). iOS uses ort `alternative-backend` and
# `build.rs` links local static libs (auto-discovers iOS-webgpu, or ORT_LIB_LOCATION).
# Optional shell exports for choosing the tree: see signing/LOCAL_IOS_BUILD.md.

[target.aarch64-apple-ios-sim]
# Keep default Apple toolchain behavior for Swift and SDK linker paths.
rustflags = []

[target.aarch64-apple-ios]
# Keep default Apple toolchain behavior for Swift and SDK linker paths.
rustflags = []
