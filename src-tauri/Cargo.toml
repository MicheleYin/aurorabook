[package]
name = "aurorabook"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "aurorabook"

[lib]
name = "aurorabook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Dev-only binary: do not ship in Tauri bundles (see required-features below).
[features]
gen-voice-samples = []

[[bin]]
name = "gen_voice_samples"
path = "src/bin/gen_voice_samples.rs"
required-features = ["gen-voice-samples"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2.3.1", features = ["sqlite"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server for audio streaming
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Audio processing (decode/encode/tag via FFmpeg on PATH; see `utils/ffmpeg_audio.rs`)
mp3lame-encoder = "0.2.3"

# EPUB processing
epub = "2.1"
zip = "0.6"
quick-xml = { version = "0.31", features = ["serialize"] }
symphonia = { version = "0.5.5", features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }

# Text processing
scraper = "0.19"
htmlparser = "0.2"
regex = "1.10"

# Utilities
base64 = "0.22"
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
num_cpus = "1.16"
once_cell = "1.19"
percent-encoding = "2.3"
tempfile = "3.8"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite"] }

# In-tree Supertonic TTS runtime
# Base ort (no EP feature). Platform targets add WebGPU / DirectML below.
ort = { version = "2.0.0-rc.12" }
ndarray = "0.17"
rand = "0.8"
rand_distr = "0.4"
unicode-normalization = "0.1"
async-stream = "0.3.6"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
# macOS desktop: WebGPU EP (links libwebgpu_dawn).
ort = { version = "2.0.0-rc.12", features = ["webgpu"] }

# Windows x86_64: WebGPU EP (Dawn / DX12).
[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["webgpu"] }

# Windows ARM64: DirectML EP (no Dawn).
[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["directml"] }

# iOS: CPU EP only (CoreML EP previously aborted / spiked memory). ORT_DIRECT_LINK +
# locally built static libs (see LOCAL_IOS_BUILD.md).
# waterkit-background: BGContinuedProcessingTaskRequest (iOS 26+) via Swift bridge.
[target.'cfg(target_os = "ios")'.dependencies]
ort = { version = "2.0.0-rc.12" }
waterkit-background = { path = "../patches/waterkit-background" }


[patch.crates-io]
audiopus_sys = { path = "../patches/audiopus_sys" }




[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Must be "unwind" so tokio can catch panics in tasks as JoinError.
# With "abort", any Rust panic (including OOM during ONNX load) becomes SIGABRT
# and kills the whole iOS process before our error handling runs.
panic = "unwind"
# Preserve floating-point precision for audio processing
# This prevents aggressive optimizations that could affect audio quality
overflow-checks = false
# Note: We keep opt-level 3 for performance, but ensure audio code uses
# proper floating-point semantics. If audio issues persist, consider:
# - Reducing opt-level to 2 for audio-related crates
# - Using #[inline(never)] on critical audio processing functions
# - Adding #[target_feature(enable = "fma")] for specific optimizations



