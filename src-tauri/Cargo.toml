[package]
name = "aurorabook"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aurorabook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
lame = "0.1"
zip = "0.6"
quick-xml = { version = "0.31", features = ["serialize"] }
scraper = "0.19"
num_cpus = "1.16"
regex = "1.10"
base64 = "0.22"
# GPU acceleration configuration:
# - CUDA: For NVIDIA GPUs (Linux/Windows) - enables GPU acceleration via kokoros cuda feature
# - CoreML: For Apple devices (macOS/iOS/iPadOS) - ONNX Runtime uses CoreML Execution Provider
#   CoreML automatically leverages GPU and Neural Engine when available on Apple devices
#   Note: Using kokoros crate with CoreML EP support built-in for macOS/iOS
# Use kokoros crate from local path (customized to support dynamic input names)
kokoros = { path = "../Kokoros/kokoros", default-features = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# ONNX Runtime with CoreML EP support for explicit CoreML EP configuration
# Using local ort crate to enable building from source for iOS
ort = { path = "../ort", default-features = true, features = ["coreml"] }
ndarray = "0.16"

[patch.crates-io]
# Patch audiopus_sys to fix CMake compatibility issue for iOS builds
audiopus_sys = { path = "../patches/audiopus_sys" }

