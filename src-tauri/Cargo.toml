[package]
name = "tts-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tts_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
lame = "0.1"
# GPU acceleration configuration:
# - CUDA: For NVIDIA GPUs (Linux/Windows) - enables GPU acceleration via kokoros cuda feature
# - CoreML: For Apple devices (macOS/iOS/iPadOS) - ONNX Runtime uses CoreML Execution Provider
#   CoreML automatically leverages GPU and Neural Engine when available on Apple devices
#   Note: Using local kokoros crate with CoreML EP support built-in for macOS/iOS
# Use local kokoros crate (modified to support CoreML EP on macOS/iOS)
# CoreML EP is automatically used on macOS/iOS via code changes in ort_base.rs
kokoros = { path = "../Kokoros/kokoros", package = "kokoros", default-features = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# ONNX Runtime with CoreML EP support for explicit CoreML EP configuration
ort = { version = "2.0.0-rc.10", default-features = true }
ndarray = "0.16"

