[package]
name = "aurorabook"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "aurorabook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2.3.1", features = ["sqlite"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Audio processing
lame = "0.1"
symphonia = { version = "0.5", features = ["all"] }

# EPUB processing
epub = "2.1"
zip = "0.6"
quick-xml = { version = "0.31", features = ["serialize"] }

# Text processing
scraper = "0.19"
htmlparser = "0.2"
regex = "1.10"

# Utilities
base64 = "0.22"
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
num_cpus = "1.16"
once_cell = "1.19"
percent-encoding = "2.3"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite"] }

# TTS engine (uses CoreML EP on Apple platforms)
# espeak is enabled by default on macOS, but not on iOS
kokoros = { path = "../Kokoros/kokoros", default-features = false, features = ["cpu"] }
ort = { path = "../ort", default-features = true }
ndarray = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
# Enable espeak on macOS (but not iOS)
kokoros = { path = "../Kokoros/kokoros", default-features = false, features = ["cpu", "espeak"] }


[dev-dependencies]
tempfile = "3.8"

[patch.crates-io]
audiopus_sys = { path = "../patches/audiopus_sys" }
espeak-rs = { path = "../piper-rs/crates/espeak-rs" }
espeak-rs-sys = { path = "../piper-rs/crates/espeak-rs-sys" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"



