[package]
name = "aurorabook"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aurorabook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
lame = "0.1"
zip = "0.6"
quick-xml = { version = "0.31", features = ["serialize"] }
scraper = "0.19"
num_cpus = "1.16"
regex = "1.10"
base64 = "0.22"
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
symphonia = { version = "0.5", features = ["all"] }
epub = "2.1"
epub-builder = "0.5"
# GPU acceleration configuration:
# - CUDA: For NVIDIA GPUs (Linux/Windows) - enables GPU acceleration via kokoros cuda feature
# - CoreML: For Apple devices (macOS/iOS/iPadOS) - ONNX Runtime uses CoreML Execution Provider
#   CoreML automatically leverages GPU and Neural Engine when available on Apple devices
#   Note: Using kokoros crate with CoreML EP support built-in for macOS/iOS
# Use kokoros crate from local path (customized to support dynamic input names)
# Enable CoreML EP support - code will automatically use it on Apple platforms only
kokoros = { path = "../Kokoros/kokoros", default-features = true }
tauri-plugin-sql = { version = "2.3.1", features = ["sqlite"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite"] }
# Note: CoreML EP is enabled by default on Apple platforms for GPU/Neural Engine acceleration
# To enable CUDA GPU support on Linux/Windows, use: features = ["cuda"]
# kokoros = { path = "../Kokoros/kokoros", default-features = true, features = ["cuda"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# ONNX Runtime with CoreML EP support for GPU/Neural Engine acceleration on Apple devices

# Use local ort crate to match the version used in src-tauri
# Base ONNX Runtime configuration
ort = { path = "../ort", default-features = true }

ndarray = "0.16"

[dev-dependencies]
tempfile = "3.8"
rusqlite = { version = "0.31", features = ["bundled"] }

[patch.crates-io]
# Patch audiopus_sys to fix CMake compatibility issue for iOS builds
audiopus_sys = { path = "../patches/audiopus_sys" }

