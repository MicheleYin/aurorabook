[package]
name = "tts-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tts_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
lame = "0.1"
# GPU acceleration configuration:
# - CUDA: For NVIDIA GPUs (Linux/Windows) - enables GPU acceleration
# - CoreML: For Apple devices (macOS/iOS/iPadOS) - ONNX Runtime uses CoreML Execution Provider
#   CoreML automatically leverages GPU and Neural Engine when available on Apple devices
#   Note: ONNX Runtime doesn't support Metal directly, but CoreML uses Metal under the hood
#   On Apple platforms, kokoros will use default features which should include CoreML if available
#   If kokoros doesn't expose CoreML feature, ONNX Runtime may auto-detect and use CoreML
[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
kokoros = { git = "https://github.com/lucasjinreal/Kokoros", package = "kokoros", features = ["cuda"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# Use kokoros crate directly - it handles CoreML via ONNX Runtime with CoreML Execution Provider
# This provides optimal ANE/GPU utilization without custom CoreML code
kokoros = { git = "https://github.com/lucasjinreal/Kokoros", package = "kokoros", default-features = true }

