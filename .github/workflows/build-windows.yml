name: Build Windows

on:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows (x86_64 / WebGPU)
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      RUST_TARGET: x86_64-pc-windows-msvc
      AURORABOOK_FFMPEG_ARCH: x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
            .cache/ffmpeg-windows
          key: ${{ runner.os }}-x86_64-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-cargo-
            ${{ runner.os }}-cargo-

      - name: Fetch Supertonic TTS models (Git LFS)
        shell: bash
        run: |
          git lfs install
          if [ ! -d supertonic-3/.git ]; then
            git clone --depth 1 https://huggingface.co/Supertone/supertonic-3 supertonic-3
          fi
          git -C supertonic-3 lfs pull
          test -f supertonic-3/onnx/tts.json

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Bundle FFmpeg for the app
        run: bun run bundle:ffmpeg:windows

      - name: Stage DirectML redistributable
        run: node scripts/bundle-windows-directml.cjs --arch=x64

      - name: Stage ort-dylibs placeholders for tauri_build
        shell: bash
        run: |
          mkdir -p src-tauri/resources/ort-dylibs
          # Real Dawn is refreshed in beforeBundleCommand after ort builds.
          # Array-style resources/ort-dylibs/ (not install-root maps) — maps break tauri_build.
          if [ ! -f src-tauri/resources/ort-dylibs/webgpu_dawn.dll ] || \
             grep -q 'placeholder' src-tauri/resources/ort-dylibs/webgpu_dawn.dll 2>/dev/null || \
             [ "$(wc -c < src-tauri/resources/ort-dylibs/webgpu_dawn.dll)" -lt 64 ]; then
            printf 'placeholder webgpu_dawn.dll; replaced after ort build\n' \
              > src-tauri/resources/ort-dylibs/webgpu_dawn.dll
          fi
          test -f src-tauri/resources/ort-dylibs/DirectML.dll
          ls -la src-tauri/resources/ort-dylibs/

      - name: Build AuroraBook (NSIS)
        shell: bash
        run: |
          node scripts/ensure-windows-ffmpeg-resource.cjs --arch=x64
          node scripts/bundle-windows-directml.cjs --arch=x64
          # Dawn is copied in beforeBundleCommand after cargo/ort produces it.
          # NSIS POSTINSTALL hook promotes Dawn/DirectML beside the installed exe.
          node scripts/tauri-cli.cjs build --target "${RUST_TARGET}"

      - name: Verify Dawn + DirectML DLLs (resources + beside exe)
        shell: bash
        run: |
          exe_dir=".cargo-target/${RUST_TARGET}/release"
          # beforeBundleCommand must leave real PEs under resources/ort-dylibs/
          # and copies them beside the exe for local/dev runs.
          for dll in webgpu_dawn.dll DirectML.dll; do
            src="src-tauri/resources/ort-dylibs/${dll}"
            test -f "${src}"
            ! grep -q "placeholder" "${src}"
            size=$(wc -c < "${src}")
            test "$size" -gt 100000
            file "${src}"
            if [ -f "${exe_dir}/${dll}" ]; then
              file "${exe_dir}/${dll}"
              ! grep -q "placeholder" "${exe_dir}/${dll}"
            else
              echo "warn: ${dll} not beside exe yet (NSIS hook covers installed layout)" >&2
            fi
          done
          ls -la "${exe_dir}"/*.dll src-tauri/resources/ort-dylibs/ 2>/dev/null || true
          test -f src-tauri/windows/nsis-hooks.nsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurorabook-windows-x86_64-${{ github.run_id }}
          path: |
            .cargo-target/${{ env.RUST_TARGET }}/release/bundle/nsis/*.exe
            .cargo-target/${{ env.RUST_TARGET }}/release/*.exe
          if-no-files-found: error
          retention-days: 14
