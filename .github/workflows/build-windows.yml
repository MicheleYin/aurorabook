name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    name: Windows (${{ matrix.label }})
    runs-on: windows-latest
    concurrency:
      group: build-windows-${{ github.workflow }}-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            label: x86_64 / WebGPU
            rust_target: x86_64-pc-windows-msvc
            ffmpeg_arch: x64
            tauri_config: ""
            verify_dawn: true
          - arch: arm64
            label: ARM64 / DirectML
            rust_target: aarch64-pc-windows-msvc
            ffmpeg_arch: arm64
            tauri_config: src-tauri/tauri.windows-arm64.conf.json
            verify_dawn: false
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      RUST_TARGET: ${{ matrix.rust_target }}
      AURORABOOK_FFMPEG_ARCH: ${{ matrix.ffmpeg_arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
            .cache/ffmpeg-windows
            .cache/directml-windows
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Fetch Supertonic TTS models (Git LFS)
        shell: bash
        run: |
          git lfs install
          if [ ! -d supertonic-3/.git ]; then
            git clone --depth 1 https://huggingface.co/Supertone/supertonic-3 supertonic-3
          fi
          git -C supertonic-3 lfs pull
          test -f supertonic-3/onnx/tts.json

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Bundle FFmpeg for the app
        run: node scripts/bundle-windows-ffmpeg.cjs --arch=${{ matrix.ffmpeg_arch }}

      - name: Stage DirectML redistributable
        run: node scripts/bundle-windows-directml.cjs --arch=${{ matrix.ffmpeg_arch }}

      - name: Stage Dawn placeholder for tauri_build (x86_64 only)
        if: matrix.verify_dawn
        shell: bash
        run: |
          mkdir -p src-tauri/resources/ort-dylibs
          # Real Dawn is refreshed in beforeBundleCommand after ort builds.
          if [ ! -f src-tauri/resources/ort-dylibs/webgpu_dawn.dll ] || \
             grep -q 'placeholder' src-tauri/resources/ort-dylibs/webgpu_dawn.dll 2>/dev/null || \
             [ "$(wc -c < src-tauri/resources/ort-dylibs/webgpu_dawn.dll)" -lt 64 ]; then
            printf 'placeholder webgpu_dawn.dll; replaced after ort build\n' \
              > src-tauri/resources/ort-dylibs/webgpu_dawn.dll
          fi
          test -f src-tauri/resources/ort-dylibs/DirectML.dll
          ls -la src-tauri/resources/ort-dylibs/

      - name: Stage ort-dylibs for tauri_build (ARM64)
        if: matrix.verify_dawn == false
        shell: bash
        run: |
          mkdir -p src-tauri/resources/ort-dylibs
          test -f src-tauri/resources/ort-dylibs/DirectML.dll
          ls -la src-tauri/resources/ort-dylibs/

      - name: Build AuroraBook (NSIS)
        shell: bash
        run: |
          node scripts/ensure-windows-ffmpeg-resource.cjs --arch=${{ matrix.ffmpeg_arch }}
          node scripts/bundle-windows-directml.cjs --arch=${{ matrix.ffmpeg_arch }}
          if [ -n "${{ matrix.tauri_config }}" ]; then
            node scripts/tauri-cli.cjs build --target "${RUST_TARGET}" -c "${{ matrix.tauri_config }}"
          else
            node scripts/tauri-cli.cjs build --target "${RUST_TARGET}"
          fi

      - name: Verify DirectML DLL (resources + beside exe)
        shell: bash
        run: |
          exe_dir=".cargo-target/${RUST_TARGET}/release"
          src="src-tauri/resources/ort-dylibs/DirectML.dll"
          test -f "${src}"
          ! grep -q "placeholder" "${src}"
          size=$(wc -c < "${src}")
          test "$size" -gt 100000
          file "${src}"
          if [ -f "${exe_dir}/DirectML.dll" ]; then
            file "${exe_dir}/DirectML.dll"
            ! grep -q "placeholder" "${exe_dir}/DirectML.dll"
          else
            echo "warn: DirectML.dll not beside exe yet (NSIS hook covers installed layout)" >&2
          fi
          test -f src-tauri/windows/nsis-hooks.nsh

      - name: Verify Dawn DLL (x86_64 only)
        if: matrix.verify_dawn
        shell: bash
        run: |
          exe_dir=".cargo-target/${RUST_TARGET}/release"
          src="src-tauri/resources/ort-dylibs/webgpu_dawn.dll"
          test -f "${src}"
          ! grep -q "placeholder" "${src}"
          size=$(wc -c < "${src}")
          test "$size" -gt 100000
          file "${src}"
          if [ -f "${exe_dir}/webgpu_dawn.dll" ]; then
            file "${exe_dir}/webgpu_dawn.dll"
            ! grep -q "placeholder" "${exe_dir}/webgpu_dawn.dll"
          else
            echo "warn: webgpu_dawn.dll not beside exe yet (NSIS hook covers installed layout)" >&2
          fi
          ls -la "${exe_dir}"/*.dll src-tauri/resources/ort-dylibs/ 2>/dev/null || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurorabook-windows-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            .cargo-target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
            .cargo-target/${{ matrix.rust_target }}/release/*.exe
          if-no-files-found: error
          retention-days: 14
