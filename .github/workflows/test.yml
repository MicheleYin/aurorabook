name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Vitest + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests with coverage
        run: bun run test:coverage

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Playwright smoke
        run: bun run test:playwright

      - name: Upload frontend LCOV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Upload frontend coverage to Codacy
        if: always()
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info
          partial: true

  rust:
    name: Rust (fast suite + llvm-cov)
    runs-on: macos-15
    env:
      # Keep artifacts inside the checkout (overrides src-tauri/.cargo/config.toml)
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Fast tests with coverage
        run: |
          mkdir -p resources/ort-dylibs resources/ffmpeg-bin \
            resources/supertonic/onnx resources/supertonic/voice_styles
          if [ ! -f resources/ffmpeg-bin/ffmpeg ]; then
            : > resources/ffmpeg-bin/ffmpeg
            chmod +x resources/ffmpeg-bin/ffmpeg
          fi
          # tauri.macos.conf.json requires this path; build.rs also stubs it
          if [ ! -f resources/ort-dylibs/libwebgpu_dawn.dylib ]; then
            printf 'placeholder\n' > resources/ort-dylibs/libwebgpu_dawn.dylib
          fi
          # Stable path under src-tauri/ (independent of CARGO_TARGET_DIR)
          OUT="${{ github.workspace }}/src-tauri/target/llvm-cov/lcov.info"
          mkdir -p "$(dirname "$OUT")"
          # --test-threads=1: the "mod" integration suite creates real ONNX/CoreML
          # TTS engine sessions; running them concurrently corrupts shared
          # Metal/GPU state and aborts the process (SIGABRT/SIGSEGV).
          cargo llvm-cov --lcov --output-path "$OUT" --lib --test mod -- --test-threads=1

      - name: Upload Rust LCOV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust-lcov
          path: src-tauri/target/llvm-cov/lcov.info
          if-no-files-found: warn

      - name: Upload Rust coverage to Codacy
        if: always()
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: src-tauri/target/llvm-cov/lcov.info
          partial: true

  coverage-final:
    name: Finalize Codacy coverage report
    needs: [frontend, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Close Codacy coverage report
        run: |
          bash <(curl -Ls https://raw.githubusercontent.com/codacy/codacy-coverage-reporter/master/get.sh) final \
            --project-token ${{ secrets.CODACY_PROJECT_TOKEN }}
